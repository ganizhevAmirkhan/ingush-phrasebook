<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Хабар - Ингушский разговорник</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css?v=20260523b">
</head>

<body>

<header class="topbar">
  <div class="title">Хабар - Ингушский разговорник</div>

  <div class="search-wrap">
    <input id="global-search" class="search" placeholder="Поиск по всем фразам…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true">
    <button id="search-btn" class="btn btn-primary">🔍</button>
    <div id="search-results" class="search-results hidden"></div>
  </div>

  <div class="admin-panel">
    <input id="gh-token" type="password" placeholder="GitHub Token" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true">
    <button onclick="adminLogin()" class="btn btn-ghost">Админ</button>
    <span id="admin-status" class="admin-status"></span>
  </div>

  <div class="ai-panel">
    <span id="ai-status" title="Статус LanguageAPI"></span>
    <button type="button" onclick="openApiAdminPanel()" class="btn btn-ghost">📡 API</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div id="category-list"></div>
  </aside>

  <main class="content">
    <h2 id="content-title">Выберите категорию</h2>
    <div id="content"></div>
  </main>
</div>

<!-- API ADMIN -->
<div id="api-admin-modal" class="modal hidden">
  <div class="modal-box api-admin-box">
    <h3 class="api-admin-title">Панель LanguageAPI</h3>

    <label>
      URL сервера
      <input id="ai-key" type="text" placeholder="https://api.inghub.ru" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
    </label>

    <div id="api-progress-wrap" class="api-progress-wrap hidden">
      <div class="api-progress-label" id="api-progress-label">Подключение…</div>
      <div class="api-progress-track">
        <div class="api-progress-bar" id="api-progress-bar"></div>
      </div>
    </div>

    <div id="api-status-grid" class="api-status-grid">
      <div class="api-status-card" id="api-st-server">Сервер: …</div>
      <div class="api-status-card" id="api-st-llm">LLM: …</div>
      <div class="api-status-card" id="api-st-test">Тест LLM: …</div>
    </div>

    <div id="api-metrics" class="api-metrics"></div>

    <label>
      Тест перевода
      <div class="api-test-row">
        <input id="api-test-ru" type="text" placeholder="Мало платят на работе" autocomplete="off">
        <button type="button" onclick="apiAdminTestTranslate()">Перевести</button>
      </div>
    </label>
    <pre id="api-test-result" class="api-test-result"></pre>

    <div id="api-moderation-section" class="hidden">
      <h4 class="api-section-title">Очередь модерации</h4>
      <ul id="api-moderation-list" class="api-moderation-list"></ul>
    </div>

    <div class="api-help">
      <a id="api-full-admin-link" href="https://api.inghub.ru/admin" target="_blank" rel="noopener">Полная админка API →</a>
      <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter ключи</a>
      <a href="https://openrouter.ai/models" target="_blank" rel="noopener">Модели OpenRouter</a>
    </div>

    <div class="modal-actions">
      <button type="button" onclick="refreshApiAdminPanel()">🔄 Обновить</button>
      <button type="button" onclick="saveAiKey()">💾 Сохранить URL</button>
      <button type="button" onclick="apiAdminRefreshData()">♻ Данные API</button>
      <button type="button" onclick="closeApiAdminPanel()">Закрыть</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="edit-modal" class="modal hidden">
  <div class="modal-box">

    <label>
      Русский:
      <textarea id="edit-ru"></textarea>
      <button onclick="aiFixRu()">🤖</button>
    </label>

    <label class="edit-ing-block">
      Ингушский:
      <textarea id="edit-ing"></textarea>
      <button type="button" id="edit-translate-btn" class="edit-ai-btn" onclick="aiTranslateIng()" title="Перевести через LanguageAPI">🤖</button>
      <div id="edit-translate-progress-wrap" class="api-progress-wrap edit-translate-progress hidden" role="status" aria-live="polite">
        <div class="api-progress-label" id="edit-translate-progress-label">Перевод…</div>
        <div class="api-progress-track">
          <div class="api-progress-bar" id="edit-translate-progress-bar"></div>
        </div>
      </div>
    </label>

    <label>
      PRON:
      <input id="edit-pron">
      <button onclick="aiMakePron()">🤖</button>
    </label>

    <div class="modal-actions">
      <button onclick="saveEdit()">💾 Сохранить</button>
      <button onclick="closeEdit()">❌ Отмена</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
<script src="script.js?v=20260523b"></script>
<script src="recorder.js?v=20260522a"></script>
<script>
  // Remove stale SW caches from older builds (they blocked script updates).
  if ("serviceWorker" in navigator) {
    caches?.keys?.().then((keys) => Promise.all(keys.map((k) => caches.delete(k))));
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((reg) => reg.unregister());
    });
  }
</script>
</body>
</html>
