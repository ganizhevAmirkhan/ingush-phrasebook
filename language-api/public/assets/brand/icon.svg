<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ghalghay API">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="45%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="peak" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="400" cy="108" r="36" fill="#fde68a" filter="url(#glow)"/>
  <circle cx="400" cy="108" r="18" fill="#fbbf24"/>
  <!-- loam peaks -->
  <path fill="url(#peak)" d="M72 360 L168 168 L264 360 Z"/>
  <path fill="url(#peak)" opacity="0.92" d="M184 360 L296 120 L408 360 Z"/>
  <path fill="url(#peak)" opacity="0.78" d="M328 360 L416 220 L504 360 Z"/>
  <!-- speech / API arc -->
  <path d="M128 388 Q256 430 384 388" fill="none" stroke="#a7f3d0" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  <!-- class markers V J B D -->
  <circle cx="148" cy="404" r="14" fill="#fff"/>
  <circle cx="204" cy="412" r="14" fill="#fef3c7"/>
  <circle cx="308" cy="412" r="14" fill="#fde68a"/>
  <circle cx="364" cy="404" r="14" fill="#fcd34d"/>
</svg>
